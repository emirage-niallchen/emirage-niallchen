name: Update GitHub stats cards

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - .github/workflows/profile-stats.yml

permissions:
  contents: write

concurrency:
  group: profile-stats-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Generate GitHub statistics
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&hide_title=true&hide_border=true&show_icons=true&include_all_commits=true&bg_color=171416&title_color=D6AE71&text_color=E5D9D0&icon_color=C65B62&ring_color=D6AE71&border_radius=8
          path: profile/stats.svg
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          fail_on_error: "true"

      - name: Generate most used languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&hide_title=true&hide_border=true&layout=compact&langs_count=6&bg_color=171416&title_color=D6AE71&text_color=E5D9D0&border_radius=8
          path: profile/top-langs.svg
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          fail_on_error: "true"

      - name: Align card heights
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          paths = [Path("profile/stats.svg"), Path("profile/top-langs.svg")]
          height = max(int(ET.parse(path).getroot().get("height")) for path in paths)
          for path in paths:
              svg = path.read_text()
              width = ET.fromstring(svg).get("width")
              svg = re.sub(r'(<svg\b[^>]*\bheight=")[^"]+', rf'\g<1>{height}', svg, count=1)
              svg = re.sub(r'(<svg\b[^>]*\bviewBox=")[^"]+', rf'\g<1>0 0 {width} {height}', svg, count=1)
              path.write_text(svg)
          PY

      - name: Commit updated cards
        env:
          PROFILE_BRANCH: ${{ github.ref_name }}
        run: |
          git add profile/stats.svg profile/top-langs.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Update GitHub stats cards [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin "$PROFILE_BRANCH"
            if git push origin "HEAD:$PROFILE_BRANCH"; then
              exit 0
            fi
          done
          exit 1
