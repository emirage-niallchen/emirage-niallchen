name: Generate contribution snake

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - .github/workflows/snake.yaml

permissions:
  contents: write

concurrency:
  group: snake-output
  cancel-in-progress: false

jobs:
  generate:
    # Match the Metrics workflow so its environment-scoped token is available.
    environment:
      name: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate light and dark snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # The repository token can return an empty contribution calendar.
          github_token: ${{ secrets.METRICS_TOKEN || github.token }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Check that both snakes move before publishing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          for name in ("github-contribution-grid-snake.svg", "github-contribution-grid-snake-dark.svg"):
              path = Path("dist") / name
              root = ET.parse(path).getroot()
              css = "".join(element.text or "" for element in root.iter("{http://www.w3.org/2000/svg}style"))
              frames = re.findall(r"@keyframes\s+s\d+\s*\{((?:[^{}]|\{[^{}]*\})*)\}", css)
              moving = any(len(set(re.findall(r"translate\(([^)]+)\)", frame))) > 1 for frame in frames)
              if not moving:
                  raise SystemExit(f"{path}: no moving snake; check METRICS_TOKEN access to contribution data. Publication stopped.")
              print(f"{path}: moving snake verified")
          PY

      - name: Publish snakes to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
